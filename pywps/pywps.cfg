[server]
maxsingleinputsize=1mb
maxrequestsize=3mb
url=http://localhost:8088/wps
outputurl=http://localhost:8088/wps-outputs/
outputpath=outputs
workdir=workdir
wd_inp_subdir=inputs
wd_out_subdir=outputs
maxprocesses=10
parallelprocesses=2

[processing]
mode=default

[logging]
level=INFO
file=logs/pywps.log
database=sqlite:///logs/pywps-logs.sqlite3
format=%(asctime)s] [%(levelname)s] file=%(pathname)s line=%(lineno)s module=%(module)s function=%(funcName)s %(message)s


[grass]
gisbase=/usr/local/grass-7.3.svn/
